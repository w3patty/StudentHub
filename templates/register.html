{% extends "base.html" %}

{% block title %}
Регистрация — StudentHub
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            ✦
        </div>

        <h1>
            Создать аккаунт
        </h1>

        <p class="auth-subtitle">
            Начни организовывать свою учёбу
        </p>


        {% if error %}

            <div class="error-message">
                ⚠️ {{ error }}
            </div>

        {% endif %}


        <form
            method="POST"
            action="/register">

            <div class="form-group">

                <label for="username">
                    Логин
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Например: nikita"
                    autocomplete="username"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Пароль
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Минимум 6 символов"
                    autocomplete="new-password"
                    required>

            </div>


            <button
                type="submit"
                class="full-btn">

                Создать аккаунт

            </button>

        </form>


        <div class="auth-footer">

            Уже есть аккаунт?

            <a href="/login">
                Войти
            </a>

        </div>

    </div>

</div>

{% endblock %}
