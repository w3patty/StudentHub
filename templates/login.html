{% extends "base.html" %}

{% block title %}
Вход — StudentHub
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            👋
        </div>

        <h1>
            С возвращением
        </h1>

        <p class="auth-subtitle">
            Войди в свой учебный кабинет
        </p>


        {% if error %}

            <div class="error-message">
                ⚠️ {{ error }}
            </div>

        {% endif %}


        <form
            method="POST"
            action="/login">

            <div class="form-group">

                <label for="username">
                    Логин
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Введите логин"
                    autocomplete="username"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Пароль
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Введите пароль"
                    autocomplete="current-password"
                    required>

            </div>


            <button
                type="submit"
                class="full-btn">

                Войти

            </button>

        </form>


        <div class="auth-footer">

            Нет аккаунта?

            <a href="/register">
                Создать аккаунт
            </a>

        </div>

    </div>

</div>

{% endblock %}
